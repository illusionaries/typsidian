name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build a release for, e.g. v0.2.0
        required: true

permissions:
  contents: write

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  macos:
    name: Package macOS arm64
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node (for electron-builder)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache Cargo (native Typst parser)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native parser
        run: bun run build:native

      - name: Build web, server and icon
        run: |
          bun run build:web
          bun run build:server
          bun run build:icon

      - name: Package DMG and ZIP (unsigned, arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --arm64 --publish never

      - name: Checksums
        run: |
          cd dist-app
          shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Typsidian ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          files: |
            dist-app/*.dmg
            dist-app/*.zip
            dist-app/SHA256SUMS.txt
